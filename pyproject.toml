[project]
name = "marine-wave-forecasting"
version = "0.1.0"
description = "Six-hour significant wave height forecasting from marine observations."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas>=3.0.6",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marine_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
